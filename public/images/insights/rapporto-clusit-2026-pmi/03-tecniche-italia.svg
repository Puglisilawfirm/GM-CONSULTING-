<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<title>Tecniche di attacco in Italia: meno DDoS dimostrativi, più malware e phishing</title>
<rect width="1100" height="620" fill="#FAF8F3"/>
<rect x="0" y="0" width="6" height="620" fill="#152238"/>
<text x="40" y="52" font-size="13" letter-spacing="2.6" fill="#A07A2F" font-weight="600">RAPPORTO CLUSIT 2026 · ELABORAZIONE GM CONSULTING</text>
<text x="40" y="92" font-size="28" fill="#1A1A1A" font-weight="700" font-family="'Bitstream Charter', Caladea, Georgia, serif">Tecniche di attacco in Italia: meno DDoS dimostrativi, più malware e phishing</text>
<text x="40" y="120" font-size="15" fill="#6B6B6B">Con il calo dell'hacktivism (dal 38,7% al 17% degli incidenti) cambia la composizione: il cybercrime a scopo di estorsione vale l'82%.</text>
<rect x="890" y="136" width="14" height="14" fill="#152238"/><text x="910" y="148" font-size="12" fill="#1A1A1A">2025</text><rect x="960" y="136" width="14" height="14" fill="#A07A2F"/><text x="980" y="148" font-size="12" fill="#1A1A1A">I sem. 2026</text><text x="316" y="182" font-size="15" fill="#1A1A1A" text-anchor="end" font-weight="600">Malware</text><rect x="330" y="160" width="254.23999999999998" height="16" fill="#152238"/><text x="592.24" y="173" font-size="13" fill="#475569">22,7%</text><rect x="330" y="180" width="481.59999999999997" height="16" fill="#A07A2F"/><text x="819.5999999999999" y="193" font-size="13" fill="#1A1A1A" font-weight="700">43%</text><text x="316" y="254" font-size="15" fill="#1A1A1A" text-anchor="end" font-weight="600">DDoS</text><rect x="330" y="232" width="431.2" height="16" fill="#152238"/><text x="769.2" y="245" font-size="13" fill="#475569">38,5%</text><rect x="330" y="252" width="190.4" height="16" fill="#A07A2F"/><text x="528.4" y="265" font-size="13" fill="#1A1A1A" font-weight="700">17%</text><text x="316" y="326" font-size="15" fill="#1A1A1A" text-anchor="end" font-weight="600">Phishing / social engineering</text><rect x="330" y="304" width="138.88" height="16" fill="#152238"/><text x="476.88" y="317" font-size="13" fill="#475569">12,4%</text><rect x="330" y="324" width="190.4" height="16" fill="#A07A2F"/><text x="528.4" y="337" font-size="13" fill="#1A1A1A" font-weight="700">17%</text><text x="316" y="398" font-size="15" fill="#1A1A1A" text-anchor="end" font-weight="600">Tecnica non divulgata</text><rect x="330" y="376" width="245.27999999999997" height="16" fill="#152238"/><text x="583.28" y="389" font-size="13" fill="#475569">21,9%</text><rect x="330" y="396" width="224.0" height="16" fill="#A07A2F"/><text x="562.0" y="409" font-size="13" fill="#1A1A1A" font-weight="700">20%</text><text x="316" y="470" font-size="15" fill="#1A1A1A" text-anchor="end" font-weight="600">Vulnerabilità</text><rect x="330" y="448" width="31.359999999999996" height="16" fill="#152238"/><text x="369.36" y="461" font-size="13" fill="#475569">2,8%</text><rect x="330" y="468" width="11.200000000000001" height="16" fill="#A07A2F"/><text x="349.2" y="481" font-size="13" fill="#1A1A1A" font-weight="700">1%</text>
<text x="40" y="594" font-size="12" fill="#6B6B6B">Fonte: Clusit, Rapporto 2026 (marzo), tecniche Italia 2025; aggiornamento ottobre 2026, pp. 27–29.</text>
<text x="1060" y="594" font-size="12" fill="#A07A2F" text-anchor="end" letter-spacing="1.5">GMCONSULTING.ONE</text>
</svg>