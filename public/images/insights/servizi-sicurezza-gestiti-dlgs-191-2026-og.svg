<!--
  Copertina social dell'Insight sul D.Lgs. 191/2026 (servizi di sicurezza
  gestiti). Le piattaforme non rendono SVG in og:image: il raster JPEG accanto
  va rigenerato da qui quando il testo cambia (1200x630, poi conversione in JPEG).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>D.Lgs. 191/2026 e servizi di sicurezza gestiti — GM Consulting S.r.l.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#1B2D4A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- matrice stilizzata: sei aree di evidenza -->
  <g opacity="0.22" fill="#C9A84C">
    <rect x="850" y="190" width="130" height="80" rx="6"/><rect x="1000" y="190" width="130" height="80" rx="6"/>
    <rect x="850" y="290" width="130" height="80" rx="6"/><rect x="1000" y="290" width="130" height="80" rx="6"/>
    <rect x="850" y="390" width="130" height="80" rx="6"/><rect x="1000" y="390" width="130" height="80" rx="6"/>
  </g>
  <rect x="0" y="0" width="10" height="630" fill="#C9A84C"/>
  <text x="70" y="110" font-size="18" letter-spacing="4" fill="#C9A84C" font-weight="600">INSIGHT · D.LGS. 191/2026</text>
  <text x="70" y="200" font-size="54" fill="#FFFFFF" font-weight="700" font-family="'Bitstream Charter', Caladea, Georgia, serif">Servizi di sicurezza</text>
  <text x="70" y="266" font-size="54" fill="#FFFFFF" font-weight="700" font-family="'Bitstream Charter', Caladea, Georgia, serif">gestiti: come qualificare</text>
  <text x="70" y="332" font-size="54" fill="#FFFFFF" font-weight="700" font-family="'Bitstream Charter', Caladea, Georgia, serif">il fornitore</text>
  <text x="70" y="406" font-size="22" fill="#E5D29A">SOC · risposta agli incidenti · test di penetrazione · audit</text>
  <text x="70" y="440" font-size="22" fill="#E5D29A">In vigore dal 6 novembre 2026 · sei aree di evidenza</text>
  <line x1="70" y1="500" x2="420" y2="500" stroke="#C9A84C" stroke-width="2"/>
  <text x="70" y="548" font-size="24" fill="#FFFFFF" font-weight="700">GM Consulting S.r.l.</text>
  <text x="70" y="580" font-size="16" letter-spacing="3" fill="#C0BFBA">STRATEGIC PLANNING &amp; BUSINESS TRANSFORMATION</text>
</svg>
