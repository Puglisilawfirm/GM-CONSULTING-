<!--
  Copertina social dell'Insight sul Rapporto Clusit 2026. Le piattaforme non
  rendono SVG in og:image: il raster JPEG accanto va rigenerato da qui quando
  il testo cambia (1200x630, poi conversione in JPEG).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
  <title>Rapporto Clusit 2026 e PMI — GM Consulting S.r.l.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1B2D"/>
      <stop offset="1" stop-color="#1B2D4A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- tavola stilizzata: serie degli incidenti -->
  <g opacity="0.22" fill="#C9A84C">
    <rect x="760" y="430" width="60" height="40"/>
    <rect x="840" y="380" width="60" height="90"/>
    <rect x="920" y="330" width="60" height="140"/>
    <rect x="1000" y="300" width="60" height="170"/>
    <rect x="1080" y="220" width="60" height="250"/>
  </g>
  <rect x="0" y="0" width="10" height="630" fill="#C9A84C"/>
  <text x="70" y="110" font-size="18" letter-spacing="4" fill="#C9A84C" font-weight="600">INSIGHT · RAPPORTO CLUSIT 2026</text>
  <text x="70" y="200" font-size="56" fill="#FFFFFF" font-weight="700" font-family="'Bitstream Charter', Caladea, Georgia, serif">Analisi dei dati e</text>
  <text x="70" y="268" font-size="56" fill="#FFFFFF" font-weight="700" font-family="'Bitstream Charter', Caladea, Georgia, serif">architettura di presidio</text>
  <text x="70" y="336" font-size="56" fill="#FFFFFF" font-weight="700" font-family="'Bitstream Charter', Caladea, Georgia, serif">per le PMI</text>
  <text x="70" y="410" font-size="22" fill="#E5D29A">507 incidenti gravi in Italia nel 2025 · 245 nel I semestre 2026</text>
  <text x="70" y="444" font-size="22" fill="#E5D29A">Manifatturiero al primo posto fra le vittime · cybercrime all'82%</text>
  <line x1="70" y1="500" x2="420" y2="500" stroke="#C9A84C" stroke-width="2"/>
  <text x="70" y="548" font-size="24" fill="#FFFFFF" font-weight="700">GM Consulting S.r.l.</text>
  <text x="70" y="580" font-size="16" letter-spacing="3" fill="#C0BFBA">STRATEGIC PLANNING &amp; BUSINESS TRANSFORMATION</text>
</svg>
