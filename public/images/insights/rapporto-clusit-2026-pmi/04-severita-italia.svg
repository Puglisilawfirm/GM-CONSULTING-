<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<title>Distribuzione per classe di severità degli incidenti in Italia</title>
<rect width="1100" height="620" fill="#FAF8F3"/>
<rect x="0" y="0" width="6" height="620" fill="#152238"/>
<text x="40" y="52" font-size="13" letter-spacing="2.6" fill="#A07A2F" font-weight="600">RAPPORTO CLUSIT 2026 · ELABORAZIONE GM CONSULTING</text>
<text x="40" y="92" font-size="28" fill="#1A1A1A" font-weight="700" font-family="'Bitstream Charter', Caladea, Georgia, serif">Distribuzione per classe di severità degli incidenti in Italia</text>
<text x="40" y="120" font-size="15" fill="#6B6B6B">Valori percentuali. Nel 2025 Clusit ha introdotto la classe «Extreme». Alto, critico ed estremo insieme: 47,6% nel 2025, 65% nel I semestre 2026.</text>
<text x="146" y="220" font-size="16" fill="#1A1A1A" text-anchor="end" font-weight="700">2025</text><rect x="160" y="190" width="430.5" height="46" fill="#C0BFBA"/><text x="375.25" y="219" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700">52,5%</text><rect x="590.5" y="190" width="322.26" height="46" fill="#152238"/><text x="751.63" y="219" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">39,3%</text><rect x="912.76" y="190" width="63.14" height="46" fill="#A07A2F"/><text x="944.33" y="219" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">7,7%</text><rect x="975.9" y="190" width="4.92" height="46" fill="#B91C1C"/><text x="146" y="330" font-size="16" fill="#1A1A1A" text-anchor="end" font-weight="700">I sem. 2026</text><rect x="160" y="300" width="287.0" height="46" fill="#C0BFBA"/><text x="303.5" y="329" font-size="15" fill="#1A1A1A" text-anchor="middle" font-weight="700">35%</text><rect x="447.0" y="300" width="467.4" height="46" fill="#152238"/><text x="680.7" y="329" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">57%</text><rect x="914.4" y="300" width="65.6" height="46" fill="#A07A2F"/><text x="947.1999999999999" y="329" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">8%</text><rect x="160" y="430" width="14" height="14" fill="#C0BFBA"/><text x="180" y="442" font-size="13" fill="#1A1A1A">Medio/basso</text><rect x="330" y="430" width="14" height="14" fill="#152238"/><text x="350" y="442" font-size="13" fill="#1A1A1A">Alto</text><rect x="500" y="430" width="14" height="14" fill="#A07A2F"/><text x="520" y="442" font-size="13" fill="#1A1A1A">Critico</text><rect x="670" y="430" width="14" height="14" fill="#B91C1C"/><text x="690" y="442" font-size="13" fill="#1A1A1A">Estremo</text><text x="160" y="500" font-size="14" fill="#475569">Gli incidenti a impatto alto crescono di circa venti punti: meno attacchi dimostrativi a basso impatto,</text><text x="160" y="522" font-size="14" fill="#475569">più attacchi criminali che bloccano l'operatività.</text>
<text x="40" y="594" font-size="12" fill="#6B6B6B">Fonte: Clusit, Rapporto 2026 (marzo), severità Italia 2025; aggiornamento ottobre 2026, pp. 29–31.</text>
<text x="1060" y="594" font-size="12" fill="#A07A2F" text-anchor="end" letter-spacing="1.5">GMCONSULTING.ONE</text>
</svg>