name: Quality

on:
  pull_request:
  push:
    branches:
      - claude/claude-md-mm70iza6cqngao7l-YUdVg

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_ANALYTICS_ENABLED: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck, tests, lint and production build
        run: pnpm check
