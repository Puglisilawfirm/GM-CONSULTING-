<!--
  Copertina social della Rassegna. Le piattaforme non rendono SVG in og:image:
  il raster `rassegna-og.jpg` versionato accanto va rigenerato da qui quando il
  testo cambia (Chromium headless a 1200x630, poi conversione in JPEG).
  Contiene testo di proposito: senza, l'anteprima resta indistinguibile da
  quella istituzionale del sito.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
  <title>Cosa Accade — GM Consulting S.r.l.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#0F1B2D"/>
      <stop offset="0.6" stop-color="#152238"/>
      <stop offset="1" stop-color="#1B2D4A"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.28" cy="0.18" r="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#C9A84C" opacity="0.16">
    <line x1="900" y1="0" x2="1200" y2="300" stroke-width="2"/>
    <line x1="960" y1="0" x2="1200" y2="240" stroke-width="2"/>
    <line x1="1020" y1="0" x2="1200" y2="180" stroke-width="2"/>
    <line x1="1080" y1="0" x2="1200" y2="120" stroke-width="2"/>
    <line x1="0" y1="630" x2="300" y2="330" stroke-width="2"/>
    <line x1="0" y1="570" x2="240" y2="330" stroke-width="2"/>
  </g>

  <rect width="1200" height="630" fill="url(#vignette)"/>

  <g fill="#FFFFFF">
    <g font-family="Helvetica, Arial, sans-serif">
      <rect x="80" y="86" width="14" height="14" fill="#C9A84C"/>
      <text x="112" y="99" font-size="22" letter-spacing="6" fill="#D4B968">GM CONSULTING</text>
    </g>
    <text x="80" y="262" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold">Cosa Accade</text>
    <text x="80" y="342" font-size="36" fill="#D8E1EE" font-family="Helvetica, Arial, sans-serif">Le notizie del giorno per la direzione d&#8217;impresa</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#C9A84C" letter-spacing="2">
      <text x="80" y="466">FINANZIAMENTI · STRATEGIA · BUSINESS INTELLIGENCE</text>
      <text x="80" y="512">CYBERSECURITY · INDUSTRIA 4.0 · COMPLIANCE</text>
    </g>
    <text x="80" y="576" font-size="24" fill="#93A5BF" font-family="Helvetica, Arial, sans-serif">Con il link alla fonte, alle 08:00 e alle 20:00</text>
  </g>
</svg>
