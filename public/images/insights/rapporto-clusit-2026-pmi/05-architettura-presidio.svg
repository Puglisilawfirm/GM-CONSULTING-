<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 840" width="1100" height="840" role="img" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<title>Architettura di riferimento del presidio a sei strati</title>
<rect width="1100" height="840" fill="#FAF8F3"/><rect x="0" y="0" width="6" height="840" fill="#152238"/>
<text x="40" y="52" font-size="13" letter-spacing="2.6" fill="#A07A2F" font-weight="600">VALUTAZIONE INDIPENDENTE GM CONSULTING</text>
<text x="40" y="92" font-size="28" fill="#1A1A1A" font-weight="700" font-family="'Bitstream Charter', Caladea, Georgia, serif">Architettura di riferimento del presidio: sei strati, un indicatore ciascuno</text>
<text x="40" y="120" font-size="15" fill="#6B6B6B">Ordine di priorità dedotto dalle tavole 2–4: prima l'identità e il ripristino, poi la rilevazione.</text>
<text x="710" y="146" font-size="12" letter-spacing="2" fill="#A07A2F" font-weight="600">INDICATORE DI ESITO</text><text x="40" y="146" font-size="12" letter-spacing="2" fill="#A07A2F" font-weight="600">STRATO · PRIORITÀ DECRESCENTE</text><rect x="40" y="160" width="640" height="70" fill="#A07A2F" rx="3"/><text x="62" y="204" font-size="30" font-weight="700" fill="#C9A84C" font-family="'Bitstream Charter', Caladea, Georgia, serif">0</text><text x="110" y="189" font-size="17" font-weight="700" fill="#FFFFFF">Governance (art. 23 D.Lgs. 138/2024)</text><text x="110" y="212" font-size="12.5" fill="#E5D29A">Delibera, ruoli, formazione dell'organo amministrativo</text><rect x="694" y="195.0" width="16" height="1.5" fill="#A07A2F"/><text x="716" y="200" font-size="13.5" fill="#1A1A1A" font-weight="600">Delibere e formazione documentate</text><rect x="40" y="242" width="640" height="70" fill="#152238" rx="3"/><text x="62" y="286" font-size="30" font-weight="700" fill="#C9A84C" font-family="'Bitstream Charter', Caladea, Georgia, serif">1</text><text x="110" y="271" font-size="17" font-weight="700" fill="#FFFFFF">Identità</text><text x="110" y="294" font-size="12.5" fill="#E5D29A">MFA resistente al phishing (FIDO2/passkey), accesso condizionale, accessi dei fornitori</text><rect x="694" y="277.0" width="16" height="1.5" fill="#A07A2F"/><text x="716" y="282" font-size="13.5" fill="#1A1A1A" font-weight="600">Copertura MFA sugli accessi critici: 100%</text><rect x="40" y="324" width="640" height="70" fill="#152238" rx="3"/><text x="62" y="368" font-size="30" font-weight="700" fill="#C9A84C" font-family="'Bitstream Charter', Caladea, Georgia, serif">2</text><text x="110" y="353" font-size="17" font-weight="700" fill="#FFFFFF">Superficie esposta</text><text x="110" y="376" font-size="12.5" fill="#E5D29A">Inventario dei servizi esposti, gestione dell'esposizione (KEV, EPSS)</text><rect x="694" y="359.0" width="16" height="1.5" fill="#A07A2F"/><text x="716" y="364" font-size="13.5" fill="#1A1A1A" font-weight="600">Latenza di correzione KEV: giorni</text><rect x="40" y="406" width="640" height="70" fill="#152238" rx="3"/><text x="62" y="450" font-size="30" font-weight="700" fill="#C9A84C" font-family="'Bitstream Charter', Caladea, Georgia, serif">3</text><text x="110" y="435" font-size="17" font-weight="700" fill="#FFFFFF">Segmentazione e OT</text><text x="110" y="458" font-size="12.5" fill="#E5D29A">Zone e condotti IEC 62443, inventario passivo, monitoraggio dei protocolli industriali</text><rect x="694" y="441.0" width="16" height="1.5" fill="#A07A2F"/><text x="716" y="446" font-size="13.5" fill="#1A1A1A" font-weight="600">Asset OT inventariati e separati: %</text><rect x="40" y="488" width="640" height="70" fill="#152238" rx="3"/><text x="62" y="532" font-size="30" font-weight="700" fill="#C9A84C" font-family="'Bitstream Charter', Caladea, Georgia, serif">4</text><text x="110" y="517" font-size="17" font-weight="700" fill="#FFFFFF">Rilevazione e risposta</text><text x="110" y="540" font-size="12.5" fill="#E5D29A">EDR/XDR con isolamento, SIEM/SOC, copertura ATT&amp;CK, esche</text><rect x="694" y="523.0" width="16" height="1.5" fill="#A07A2F"/><text x="716" y="528" font-size="13.5" fill="#1A1A1A" font-weight="600">MTTD e MTTR; copertura delle tecniche</text><rect x="40" y="570" width="640" height="70" fill="#152238" rx="3"/><text x="62" y="614" font-size="30" font-weight="700" fill="#C9A84C" font-family="'Bitstream Charter', Caladea, Georgia, serif">5</text><text x="110" y="599" font-size="17" font-weight="700" fill="#FFFFFF">Ripristino</text><text x="110" y="622" font-size="12.5" fill="#E5D29A">Copie immutabili e isolate, RTO/RPO dichiarati, prove verbalizzate</text><rect x="694" y="605.0" width="16" height="1.5" fill="#A07A2F"/><text x="716" y="610" font-size="13.5" fill="#1A1A1A" font-weight="600">RTO e RPO provati due volte l'anno</text><rect x="40" y="652" width="640" height="70" fill="#152238" rx="3"/><text x="62" y="696" font-size="30" font-weight="700" fill="#C9A84C" font-family="'Bitstream Charter', Caladea, Georgia, serif">6</text><text x="110" y="681" font-size="17" font-weight="700" fill="#FFFFFF">Catena di fornitura</text><text x="110" y="704" font-size="12.5" fill="#E5D29A">Evidenze (SBOM, test), notifica in ore, accessi nominativi a tempo</text><rect x="694" y="687.0" width="16" height="1.5" fill="#A07A2F"/><text x="716" y="692" font-size="13.5" fill="#1A1A1A" font-weight="600">Fornitori critici con evidenze e accessi vincolati: %</text><text x="40" y="758" font-size="13.5" fill="#475569">Gli strati 1–6 sono scelte tecniche; lo strato 0 è ciò che le rende deliberate.</text><text x="40" y="780" font-size="13.5" fill="#475569">Un SIEM acquistato senza gli strati 1, 3 e 5 misura l'incidente, non lo impedisce.</text>
<text x="40" y="814" font-size="12" fill="#6B6B6B">Riferimenti: D.Lgs. 138/2024 artt. 23–25; Determinazione ACN 379907/2025; IEC 62443; MITRE ATT&amp;CK; CISA KEV; FIRST EPSS; Reg. (UE) 2024/2847.</text>
<text x="1060" y="814" font-size="12" fill="#A07A2F" text-anchor="end" letter-spacing="1.5">GMCONSULTING.ONE</text>
</svg>