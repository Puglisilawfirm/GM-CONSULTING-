<!--
  Copertina social dell'Insight sul Voucher Cloud & Cybersecurity. Le
  piattaforme non rendono SVG in og:image: il raster JPEG versionato accanto va
  rigenerato da qui quando il testo cambia (1200x630, poi conversione in JPEG).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img">
  <title>Voucher Cloud &amp; Cybersecurity — GM Consulting S.r.l.</title>
  <defs>
    <pattern id="scanline" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" y="2" fill="#0F1E36" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#152238"/>
  <rect width="1200" height="630" fill="url(#scanline)"/>

  <g stroke="#C9A84C" opacity="0.16">
    <line x1="900" y1="0" x2="1200" y2="300" stroke-width="2"/>
    <line x1="960" y1="0" x2="1200" y2="240" stroke-width="2"/>
    <line x1="1020" y1="0" x2="1200" y2="180" stroke-width="2"/>
    <line x1="1080" y1="0" x2="1200" y2="120" stroke-width="2"/>
    <line x1="0" y1="630" x2="300" y2="330" stroke-width="2"/>
    <line x1="0" y1="570" x2="240" y2="330" stroke-width="2"/>
  </g>

  <g fill="#FAF8F3">
    <g font-family="Helvetica, Arial, sans-serif">
      <rect x="80" y="86" width="14" height="14" fill="#C9A84C"/>
      <text x="112" y="99" font-size="22" letter-spacing="6" fill="#D4B968">GM CONSULTING</text>
    </g>
    <text x="80" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold">Voucher Cloud</text>
    <text x="80" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold">&amp; Cybersecurity</text>
    <text x="80" y="384" font-size="34" fill="#EEE7D7" font-family="Helvetica, Arial, sans-serif">150 milioni per PMI e professionisti</text>
    <g font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#D4B968" letter-spacing="2">
      <text x="80" y="474">FONDO PERDUTO 50% · FINO A 20.000 EURO</text>
      <text x="80" y="518">PRECOMPILAZIONE 20 OTTOBRE · INVIO 10 NOVEMBRE</text>
    </g>
    <text x="80" y="578" font-size="24" fill="#EEE7D7" fill-opacity="0.7" font-family="Helvetica, Arial, sans-serif">Sportello a ordine cronologico: vince chi arriva pronto</text>
  </g>
</svg>
