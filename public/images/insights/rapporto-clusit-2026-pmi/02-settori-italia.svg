<text x="40" y="52" font-size="13" letter-spacing="2.6" fill="#A07A2F" font-weight="600">RAPPORTO CLUSIT 2026 · ELABORAZIONE GM CONSULTING</text>
<text x="40" y="92" font-size="28" fill="#1A1A1A" font-weight="700" font-family="'Bitstream Charter', Caladea, Georgia, serif">Distribuzione settoriale degli incidenti in Italia, 2025 e I semestre 2026</text>
<text x="40" y="120" font-size="15" fill="#6B6B6B">Primi cinque settori per quota di incidenti. Le vittime italiane sono il 17% del manifatturiero mondiale, contro il 5% del totale.</text>
